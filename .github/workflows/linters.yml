name: Linters

on:
  workflow_call:
    inputs:
      silent_linters:
        description: Linters don't fail jobs, checking only via sonarcloud quality gate
        default: false
        type: boolean
        required: false

env:
  CI_IMAGE: cr.yandex/crp2m71jbo1s20lvf839/ci-python:latest

jobs:
  flake8:
    name: Flake8
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Yandex Cloud CR Login
        uses: yc-actions/yc-cr-login@v1
        with:
          yc-sa-json-credentials: ${{ secrets.YC_SECRET }}

      - name: Pull CI image
        run: docker pull ${{ env.CI_IMAGE }}

      - name: Run flake8 silent
        if: ${{ inputs.silent_linters }}
        run: |
          docker run --rm -v ${{ github.workspace }}:/app -w /app ${{ env.CI_IMAGE }} \
            flake8 --count | tee flake8.txt

      - name: Run flake8
        if: ${{ !inputs.silent_linters }}
        run: |
          set -o pipefail
          docker run --rm -v ${{ github.workspace }}:/app -w /app ${{ env.CI_IMAGE }} \
            flake8 --count | tee flake8.txt

      - name: Upload flake8 report
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: flake8_report
          path: flake8.txt

  pylint:
    name: PyLint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Yandex Cloud CR Login
        uses: yc-actions/yc-cr-login@v1
        with:
          yc-sa-json-credentials: ${{ secrets.YC_SECRET }}

      - name: Pull CI image
        run: docker pull ${{ env.CI_IMAGE }}

      - name: Run pylint silent
        if: ${{ inputs.silent_linters }}
        run: |
          docker run --rm -v ${{ github.workspace }}:/app -w /app ${{ env.CI_IMAGE }} \
            pylint read_comics --output-format=parseable | tee pylint.txt

      - name: Run pylint
        if: ${{ !inputs.silent_linters }}
        run: |
          set -o pipefail
          docker run --rm -v ${{ github.workspace }}:/app -w /app ${{ env.CI_IMAGE }} \
            pylint read_comics --output-format=parseable | tee pylint.txt

      - name: Upload pylint report
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: pylint_report
          path: pylint.txt

  mypy:
    name: MyPy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Yandex Cloud CR Login
        uses: yc-actions/yc-cr-login@v1
        with:
          yc-sa-json-credentials: ${{ secrets.YC_SECRET }}

      - name: Pull CI image
        run: docker pull ${{ env.CI_IMAGE }}

      - name: Run mypy silent
        if: ${{ inputs.silent_linters }}
        run: |
          docker run --rm -v ${{ github.workspace }}:/app -w /app ${{ env.CI_IMAGE }} \
            mypy --soft-error-limit=-1 . | tee mypy.txt

      - name: Run mypy
        if: ${{ !inputs.silent_linters }}
        run: |
          set -o pipefail
          docker run --rm -v ${{ github.workspace }}:/app -w /app ${{ env.CI_IMAGE }} \
            mypy --soft-error-limit=-1 . | tee mypy.txt

      - name: Upload mypy report
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: mypy_report
          path: mypy.txt

  frontend:
    name: Frontend (prettier, eslint, typecheck)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install

      - name: Run prettier
        working-directory: frontend
        run: pnpm format

      - name: Run eslint
        working-directory: frontend
        run: pnpm eslint . --format json --output-file eslint-report.json || true

      - name: Run typecheck
        working-directory: frontend
        run: pnpm typecheck

      - name: Upload eslint report
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: eslint_report
          path: frontend/eslint-report.json
