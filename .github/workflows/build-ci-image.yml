name: Build CI Image

on:
  push:
    branches: [main, develop]
    paths:
      - 'requirements/*.txt'
      - 'compose/ci/Dockerfile'
  workflow_dispatch:
  schedule:
    # Weekly rebuild on Sundays at 00:00 UTC
    - cron: '0 0 * * 0'

env:
  CI_IMAGE: cr.yandex/crp2m71jbo1s20lvf839/ci-python

jobs:
  build:
    name: Build and push CI image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Yandex Cloud CR Login
        uses: yc-actions/yc-cr-login@v1
        with:
          yc-sa-json-credentials: ${{ secrets.YC_SECRET }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./compose/ci/Dockerfile
          push: true
          tags: |
            ${{ env.CI_IMAGE }}:latest
            ${{ env.CI_IMAGE }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.CI_IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.CI_IMAGE }}:buildcache,mode=max
