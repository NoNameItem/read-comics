name: Unit tests

on:
  workflow_call:

env:
  CI_IMAGE: cr.yandex/crp2m71jbo1s20lvf839/ci-python:latest

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate env files
        run: |
          mkdir -p .envs/.local
          cat > .envs/.local/.django << 'EOF'
          USE_DOCKER=yes
          DJANGO_SETTINGS_MODULE=config.settings.test
          EOF
          cat > .envs/.local/.django_unsafe << 'EOF'
          DO_SPACE_DATA_KEY=test
          DO_SPACE_DATA_SECRET=test
          COMICVINE_API_KEYS=test
          MONGO_URL=mongodb://read_comics:read_comics@mongodb:27017/read_comics
          CELERY_BROKER_URL=amqp://test:test@rabbitmq:5672/test
          CELERY_RESULT_BACKEND=mongodb://read_comics:read_comics@mongodb:27017/read_comics
          FLOWER_MAX_TASKS=999999
          FLOWER_BROKER_API=http://test:test@rabbitmq:15672/api/
          EOF
          cat > .envs/.local/.postgres << 'EOF'
          POSTGRES_HOST=postgres
          POSTGRES_PORT=5432
          POSTGRES_DB=read_comics
          POSTGRES_USER=read_comics
          POSTGRES_PASSWORD=read_comics
          EOF
          cat > .envs/.local/.mongo << 'EOF'
          MONGO_INITDB_ROOT_USERNAME=read_comics
          MONGO_INITDB_ROOT_PASSWORD=read_comics
          MONGO_INITDB_DATABASE=read_comics
          EOF
          cat > .envs/.local/.rabbit_unsafe << 'EOF'
          RABBITMQ_DEFAULT_USER=test
          RABBITMQ_DEFAULT_PASS=test
          RABBITMQ_DEFAULT_VHOST=test
          EOF

      - name: Yandex Cloud CR Login
        uses: yc-actions/yc-cr-login@v1
        with:
          yc-sa-json-credentials: ${{ secrets.YC_SECRET }}

      - name: Pull CI image
        run: docker pull ${{ env.CI_IMAGE }}

      - name: Start services
        run: docker compose -f ci.yml up -d postgres mongodb redis rabbitmq

      - name: Wait for services
        run: |
          echo "Waiting for postgres..."
          timeout 30 bash -c 'until docker compose -f ci.yml exec -T postgres pg_isready; do sleep 1; done'
          echo "Waiting for mongodb..."
          timeout 30 bash -c 'until docker compose -f ci.yml exec -T mongodb mongosh --eval "db.runCommand({ping:1})" --quiet; do sleep 1; done'

      - name: Run Django Tests
        run: |
          docker compose -f ci.yml run --rm django \
            pytest --cov read_comics --cov-report xml:coverage.xml --cov-report term --cov-config=setup.cfg --junitxml=test_report.xml \
            || true

      - name: Save Coverage report artifact
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: coverage_report
          path: coverage.xml

      - name: Save test report artifact
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: test_report
          path: test_report.xml

      - name: Tear down
        if: success() || failure()
        run: docker compose -f ci.yml down
