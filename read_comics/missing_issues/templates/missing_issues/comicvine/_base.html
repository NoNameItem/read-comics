<div class="modal-content">
  <div class="modal-header">
    <h5 class="modal-title">{{ title }}</h5>
    <button type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">&times;</span></button>
  </div>
  <div class="modal-body">
    {% if list_only %}
      <div class="alert alert-warning">Only list data downloaded so far, details are not crawled yet</div>
    {% endif %}
    {% block body %}{% endblock %}
  </div>
  <div class="modal-footer">
    {% if crawl_date %}<small class="text-muted mr-auto">Data as of {{ crawl_date|date:"Y-m-d" }}</small>{% endif %}
    {% if site_detail_url %}<a class="btn btn-primary" href="{{ site_detail_url }}" target="_blank" rel="noopener">Open on ComicVine</a>{% endif %}
    <button type="button" class="btn btn-light" data-dismiss="modal">Close</button>
  </div>
</div>
