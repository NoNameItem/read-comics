exclude: "^docs/|/migrations/|.idea/frontend/frontend_old"
default_stages: [commit]

repos:
  - repo: https://github.com/psf/black
    rev: 25.12.0
    hooks:
      - id: black

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml

  - repo: https://github.com/PyCQA/isort
    rev: 7.0.0
    hooks:
      - id: isort

# ,flake8-return==1.2.0
  - repo: https://github.com/PyCQA/flake8
    rev: 7.3.0
    hooks:
      - id: flake8
        args: ["--config=setup.cfg"]
        additional_dependencies: [flake8-isort==7.0.0,flake8-bugbear==25.11.29,flake8-comprehensions==3.17.0,flake8-quotes==3.3.2,flake8-simplify==0.22.0,flake8-no-pep420==2.7.0,flake8-use-fstring==1.4,flake8-black==0.4.0]

# sets up .pre-commit-ci.yaml to ensure pre-commit dependencies stay up to date
ci:
  autoupdate_schedule: weekly
  skip: []
  submodules: false
