exclude: "^docs/|/migrations/|^frontend/"
default_stages: [commit]

repos:
  - repo: https://github.com/psf/black
    rev: 23.12.0
    hooks:
      - id: black

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.0.1
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml

  - repo: https://github.com/PyCQA/isort
    rev: 5.13.2
    hooks:
      - id: isort

  - repo: https://github.com/PyCQA/flake8
    rev: 6.1.0
    hooks:
      - id: flake8
        args: ["--config=setup.cfg"]
        additional_dependencies: [flake8-isort==6.1.1,flake8-bugbear==23.12.2,flake8-comprehensions==3.14.0,flake8-return==1.2.0,flake8-quotes==3.3.2,flake8-simplify==0.21.0,flake8-no-pep420==2.7.0,flake8-use-fstring==1.4,flake8-black==0.3.3]

# sets up .pre-commit-ci.yaml to ensure pre-commit dependencies stay up to date
ci:
  autoupdate_schedule: weekly
  skip: []
  submodules: false
