services:
  django:
    image: cr.yandex/crp2m71jbo1s20lvf839/ci-python:latest
    container_name: django
    depends_on:
      - postgres
      - redis
      - rabbitmq
      - mongodb
    volumes:
      - .:/app:z
    env_file:
      - ./.envs/.local/.django
      - ./.envs/.local/.django_unsafe
      - ./.envs/.local/.postgres
    working_dir: /app

  postgres:
    image: postgres:18.1
    container_name: postgres
    env_file:
      - ./.envs/.local/.postgres

  mongodb:
    image: mongo:8.0.4
    container_name: mongodb
    volumes:
      - ./compose/local/mongodb:/docker-entrypoint-initdb.d
      - ./compose/local/mongodb/secret.key:/data/db/secret.key
    env_file:
      - ./.envs/.local/.mongo

  redis:
    image: redis:6
    container_name: redis

  rabbitmq:
    hostname: rabbitmq
    container_name: rabbitmq
    image: rabbitmq:4-management
    env_file:
      - ./.envs/.local/.rabbit_unsafe
